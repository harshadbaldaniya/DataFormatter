<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Data Formatter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --bg:#0b1120; --surface:#111a2e; --border:#22304a; --text:#e6ebf5;
    --muted:#8fa0bd; --faint:#526183; --accent:#3b82f6; --red:#c4554d;
    --radius:6px; --font:'Segoe UI',Arial,sans-serif; --mono:'Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    min-height:100vh;display:flex;align-items:center;justify-content:center;}
  #app{max-width:520px;width:100%;margin:0 auto;padding:40px 20px 80px;}
  h1{font-size:16px;font-weight:600;text-align:center;color:var(--muted);margin:0 0 34px;letter-spacing:.02em;}
  .back{font-size:12.5px;color:var(--faint);cursor:pointer;margin-bottom:16px;display:inline-block;}
  .back:hover{color:var(--muted);}

  /* upload */
  .dropzone{border:2px dashed var(--border);border-radius:16px;width:120px;height:100px;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .dropzone:hover, .dropzone.drag{border-color:var(--accent);}
  .dropzone .arrow{font-size:26px;color:var(--muted);}
  .upload-label{text-align:center;color:var(--muted);font-size:14px;margin-bottom:26px;}
  input[type=file]{display:none;}
  .file-chip{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:20px;font-size:12.5px;}
  .file-chip button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;}
  .file-chip button:hover{color:var(--red);}

  /* result radios */
  .result-label{font-size:14px;color:var(--muted);margin-bottom:12px;}
  .radio-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);
    border-radius:var(--radius);margin-bottom:10px;cursor:pointer;background:var(--surface);}
  .radio-row:hover{border-color:var(--accent);}
  .radio-row input{accent-color:var(--accent);width:15px;height:15px;}
  .radio-row span{font-size:14px;}

  /* column list */
  .col-heading{font-size:14px;color:var(--muted);margin:26px 0 12px;}
  .col-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .col-row .name{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 12px;font-size:13.5px;font-family:var(--font);}
  .count-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .count-label{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 12px;font-size:13.5px;font-family:var(--font);}
  .count-value{flex:0 0 60px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 12px;font-size:13.5px;font-family:var(--font);text-align:center;}
  .col-row input.name{width:100%;color:var(--text);}
  .col-row select.src{width:auto;min-width:0;flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 8px;font-size:12px;color:var(--muted);font-family:var(--font);}
  .col-row .src-empty{width:150px;flex-shrink:0;}
  .icon-btn{width:30px;height:30px;flex-shrink:0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);color:var(--muted);cursor:pointer;font-size:14px;font-family:var(--mono);}
  .icon-btn:hover{color:var(--text);border-color:var(--faint);}
  .icon-btn.x:hover{color:var(--red);border-color:var(--red);}
  .icon-btn:disabled{opacity:.25;cursor:default;}

  .add-row{display:flex;gap:8px;margin:14px 0 0;}
  .add-row input{flex:1;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
    padding:9px 12px;font-size:13px;color:var(--text);font-family:var(--font);}

  /* buttons */
  .btn{width:100%;padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-size:14px;font-weight:600;cursor:pointer;margin-top:22px;}
  .btn:hover{border-color:var(--faint);}
  .btn-gold{background:var(--accent);border-color:var(--accent);color:#ffffff;}
  .btn-gold:hover{background:#2f6fd1;}
  .btn[disabled]{opacity:.35;filter:blur(.3px);cursor:not-allowed;}
  .btn[disabled]:hover{border-color:var(--border);}
  .link-btn{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--faint);
    text-decoration:underline;cursor:pointer;background:none;border:none;width:100%;}
  .link-btn:hover{color:var(--muted);}

  .hint{font-size:11.5px;color:var(--faint);text-align:center;margin-top:10px;}

  @keyframes rowBounce{
    0%{transform:scale(1);}
    30%{transform:scale(1.035) translateY(-2px);}
    60%{transform:scale(0.98);}
    100%{transform:scale(1);}
  }
  .col-row.bounce{animation:rowBounce 0.35s ease;}

  @media (max-width:480px){
    .col-row{flex-wrap:wrap;}
    .col-row .name{flex:1 1 100%;order:1;}
    .col-row select.src, .col-row .src-empty{order:2;flex:1 1 auto;width:auto;}
    .col-row .icon-btn{order:3;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const state = {
  step: 1, fileName:null, headers:[], rows:[], context:'student', companyName:'', attendanceDate:'',
  permanentFormat: null, mode:null, modeChoice:null,
  currentFormat: [], outputHeaders:[], outputRows:[], submitted:false,
  onboarding:false, draft:[],
};

const DEFAULT_FORMAT = [
  {name:'Sr. No.', type:'serial'},
  {name:'EnrollmentNo'},{name:'FirstName'},{name:'MiddleName'},{name:'LastName'},
  {name:'StudentMobNo'},{name:'EmailId'},{name:'CurrentDegree'},{name:'SSCPercentage'},
  {name:'HSCPercentage'},{name:'DiplomaPercentage'},{name:'Graduation Percentage'},
  {name:'Current CGPA'},{name:'Resume Link'},{name:'Job Profile'}
];

const ATTENDANCE_DEFAULT_FORMAT = [
  {name:'Sr. No.', type:'serial'},
  {name:'Enrollment No.', type:'normal'},
  {name:'Name', type:'concat', keywords:['first','middle','last']},
  {name:'Department', type:'normal'},
  {name:'Mobile No.', type:'normal'},
  {name:'Job Profile', type:'normal'},
  {name:'Signature', type:'blank'},
  {name:'Remark', type:'blank'}
];

function formatKey(ctx){ return ctx==='attendance' ? 'lj_format_attendance_v3' : 'lj_format_v2'; }
async function loadFmt(ctx){
  const key = formatKey(ctx);
  if(window.storage){
    try{
      const r = await window.storage.get(key);
      if(r && r.value) return JSON.parse(r.value);
    }catch(e){ /* no saved format yet */ }
    return null;
  }
  try{ const r=localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; }
}
async function saveFmt(cols, ctx){
  const key = formatKey(ctx || state.context);
  if(window.storage){
    try{ await window.storage.set(key, JSON.stringify(cols)); }
    catch(e){ console.warn('save failed', e); }
    return;
  }
  try{ localStorage.setItem(key, JSON.stringify(cols)); }catch(e){}
}

const FIELD_ALIASES = {
  studentmobno: ['mobile','mob','contact','phone','whatsapp'],
  enrollmentno: ['enrollment','enroll'],
  firstname: ['firstname','fname'],
  middlename: ['middlename','mname'],
  lastname: ['lastname','surname'],
  emailid: ['email'],
  currentdegree: ['degree','department','branch','course'],
  sscpercentage: ['ssc','10th'],
  hscpercentage: ['hsc','12th'],
  diplomapercentage: ['diploma'],
  graduationpercentage: ['graduation','bachelor'],
  currentcgpa: ['cgpa','cpi'],
  resumelink: ['resume','cv'],
  jobprofile: ['jobprofile','jobtitle','role','profile'],
};

function uid(){ return 'c'+Math.random().toString(36).slice(2,9); }
function norm(s){ return String(s||'').trim().toLowerCase().replace(/[\s_-]+/g,''); }
function autoMatch(name, headers){
  const n = norm(name);
  let m = headers.find(h=>norm(h)===n);
  if(m) return m;
  m = headers.find(h=>norm(h).includes(n)||n.includes(norm(h)));
  if(m) return m;
  const aliases = FIELD_ALIASES[n];
  if(aliases){
    m = headers.find(h=>{ const hn=norm(h); return aliases.some(a=>hn.includes(a)); });
    if(m) return m;
  }
  return null;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function resetAll(){
  state.step=1; state.fileName=null; state.headers=[]; state.rows=[]; state.context='student'; state.companyName=''; state.attendanceDate='';
  state.mode=null; state.modeChoice=null; state.currentFormat=[]; state.outputHeaders=[];
  state.outputRows=[]; state.submitted=false; state.onboarding=false; render();
}

function handleFile(file, context){
  state.context = context || 'student';
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true}).map(row=>
        row.map(cell => typeof cell === 'number' ? (Number.isInteger(cell) ? cell.toString() : String(cell)) : cell)
      );
      if(!aoa.length){ alert('File is empty.'); return; }
      const rawHeaders = aoa[0].map(h=>String(h).trim());
      const headers = []; const headerIdx = [];
      rawHeaders.forEach((h,i)=>{ if(h){ headers.push(h); headerIdx.push(i); } });
      const rows = aoa.slice(1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{
        const o={}; headers.forEach((h,hi)=>{ const i=headerIdx[hi]; o[h] = r[i]!==undefined ? String(r[i]) : ''; }); return o;
      });
      if(!headers.length || !rows.length){ alert('Could not find header + data rows.'); return; }
      state.fileName=file.name; state.headers=headers; state.rows=rows;
      proceedAfterUpload();
    }catch(err){ console.error(err); alert('Could not read this file.'); }
  };
  reader.readAsArrayBuffer(file);
}
async function proceedAfterUpload(){
  const loaded = await loadFmt(state.context);
  if(loaded && loaded.length){
    state.permanentFormat = loaded;
    state.step = 2;
  }else if(state.context==='student'){
    state.permanentFormat = DEFAULT_FORMAT.map(c => ({id:uid(), name:c.name, type:c.type}));
    await saveFmt(state.permanentFormat);
    state.step = 2;
  }else{
    state.permanentFormat = ATTENDANCE_DEFAULT_FORMAT.map(c => ({id:uid(), name:c.name, type:c.type, keywords:c.keywords}));
    await saveFmt(state.permanentFormat);
    state.step = 2;
  }
  render();
}

/* onboarding: define permanent columns once */
function draftAdd(name){
  name=(name||'').trim(); if(!name) return;
  if(state.draft.some(c=>norm(c.name)===norm(name))) return;
  state.draft.push({id:uid(), name}); render();
}
function draftMove(id,dir){
  const i=state.draft.findIndex(c=>c.id===id), j=i+dir;
  if(j<0||j>=state.draft.length) return;
  [state.draft[i],state.draft[j]]=[state.draft[j],state.draft[i]]; render();
}
function draftDel(id){ state.draft=state.draft.filter(c=>c.id!==id); render(); }
async function saveOnboarding(){
  if(!state.draft.length){ alert('Add at least one column.'); return; }
  state.permanentFormat = state.draft.map(c=>({id:c.id,name:c.name}));
  await saveFmt(state.permanentFormat, state.context);
  state.step = 2; render();
}

/* choose permanent / edit */
function buildCurrentFormat(){
  return state.permanentFormat.map(c=>{
    if(c.type==='serial') return {id:c.id, name:c.name, type:'serial'};
    if(c.type==='blank') return {id:c.id, name:c.name, type:'blank'};
    if(c.type==='concat') return {id:c.id, name:c.name, type:'concat', keywords:c.keywords,
      partHeaders:(c.keywords||[]).map(kw=>state.headers.find(h=>norm(h).includes(kw))||null)};
    return {id:c.id, name:c.name, source: autoMatch(c.name, state.headers)};
  });
}
function selectPermanent(){
  state.modeChoice = 'permanent';
  state.mode = 'permanent';
  state.currentFormat = buildCurrentFormat();
  buildOutput();
  state.submitted = true;
  downloadFile();
  if(state.context==='student') setTimeout(()=>downloadWhatsapp(true), 500);
  state.step = 4;
  render();
}
function selectEdit(){
  state.modeChoice = 'edit';
  render();
}
function proceedChoice(){
  if(state.modeChoice!=='edit') return;
  state.mode = 'edit';
  state.currentFormat = buildCurrentFormat();
  state.submitted = false;
  state.step = 3;
  render();
}

/* column update screen */
function colMove(id,dir){
  const i=state.currentFormat.findIndex(c=>c.id===id), j=i+dir;
  if(j<0||j>=state.currentFormat.length) return;
  [state.currentFormat[i],state.currentFormat[j]]=[state.currentFormat[j],state.currentFormat[i]]; render();
}
function colDel(id){ state.currentFormat = state.currentFormat.filter(c=>c.id!==id); render(); }

let dragState = {arr:null, index:null};
let justMoved = new Set();
const _dragGhost = new Image();
_dragGhost.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7';
function dragStart(e, arrKey, i){
  dragState = {arr:arrKey, index:i};
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(i));
  e.dataTransfer.setDragImage(_dragGhost, 0, 0);
}
function dragOverRow(e, arrKey, i){
  e.preventDefault();
  if(dragState.arr!==arrKey || dragState.index===null || dragState.index===i) return;
  const arr = arrKey==='draft' ? state.draft : state.currentFormat;
  const movedItem = arr[dragState.index];
  const item = arr.splice(dragState.index,1)[0];
  arr.splice(i,0,item);
  dragState.index = i;
  justMoved = new Set([movedItem.id]);
  render();
  setTimeout(()=>{ justMoved = new Set(); }, 350);
}
function dragEnd(){ dragState = {arr:null, index:null}; }
function colRename(id,val){ const c=state.currentFormat.find(c=>c.id===id); if(c) c.name=val; }
function colSetSource(id,val){ const c=state.currentFormat.find(c=>c.id===id); if(c) c.source=val||null; render(); }
function addCol(){
  const input = document.getElementById('newColName');
  const name = (input.value||'').trim();
  if(!name) return;
  state.currentFormat.push({id:uid(), name, source: autoMatch(name, state.headers)});
  input.value=''; render();
}
function addNameConcat(){
  const find = kw => state.currentFormat.find(c=>norm(c.name).includes(kw));
  const first = find('first');
  const middle = find('middle');
  const last = find('last');
  const parts = [first, middle, last].filter(Boolean).map(c=>c.id);
  if(!parts.length){ alert('Could not find First/Middle/Last Name columns to combine.'); return; }
  if(state.currentFormat.some(c=>norm(c.name)==='name')) { alert('A "Name" column already exists.'); return; }
  state.currentFormat.push({id:uid(), name:'Name', concat:true, parts});
  render();
}

function buildOutput(){
  state.outputHeaders = state.currentFormat.map(c=>c.name);
  state.outputRows = state.rows.map((r,ri)=>{
    const o={};
    state.currentFormat.forEach(c=>{
      if(c.type==='serial'){
        o[c.name] = ri+1;
      }else if(c.type==='blank'){
        o[c.name] = '';
      }else if(c.type==='concat'){
        o[c.name] = (c.partHeaders||[]).map(h=> h ? (r[h]??'') : '').filter(Boolean).join(' ').trim();
      }else if(c.concat){
        o[c.name] = c.parts.map(pid=>{
          const pc = state.currentFormat.find(x=>x.id===pid);
          return pc && pc.source ? (r[pc.source] ?? '') : '';
        }).filter(Boolean).join(' ').trim();
      }else{
        o[c.name] = c.source ? (r[c.source]??'') : '';
      }
    });
    return o;
  });
}
function submitCols(){
  if(!state.currentFormat.length){ alert('No columns.'); return; }
  buildOutput(); state.submitted=true;
  downloadFile();
  if(state.context==='student') setTimeout(()=>downloadWhatsapp(true), 500);
  state.step=4; render();
}

/* downloads */
function formatDateDMY(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return `${d}-${m}-${y}`;
}

async function downloadFile(){
  if(!state.outputRows.length) return;
  const base = (state.fileName||'student-data').replace(/\.[^.]+$/,'');
  if(state.context==='attendance'){
    await downloadAttendanceXlsx(base);
    return;
  }
  const ws = XLSX.utils.json_to_sheet(state.outputRows, {header: state.outputHeaders});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Student Data');
  XLSX.writeFile(wb, base + '-formatted.xlsx');
}

async function downloadAttendanceXlsx(base){
  const headers = state.outputHeaders;
  const colCount = headers.length;
  const sigRemarkIdx = headers.reduce((arr,h,i)=>{ const n=norm(h); if(n==='signature'||n==='remark') arr.push(i); return arr; }, []);
  const otherIdx = headers.map((_,i)=>i).filter(i=>!sigRemarkIdx.includes(i));
  const GREY = 'FFBFBFBF', GREEN = 'FF92D050';

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Attendance');

  function styleCell(r,c,value,fill){
    const cell = ws.getCell(r,c);
    cell.value = value;
    cell.alignment = {horizontal:'center', vertical:'middle'};
    cell.font = {bold:true};
    if(fill) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:fill}};
    return cell;
  }

  ws.mergeCells(1,1,1,Math.max(colCount,1));
  styleCell(1,1,'IIPC 2027',GREY);

  ws.mergeCells(2,1,2,Math.max(colCount,1));
  styleCell(2,1, `${(state.companyName||'').trim() || 'Company Name'} Attendance Sheet`, GREY);

  otherIdx.forEach(i=>{
    const col=i+1;
    ws.mergeCells(3,col,4,col);
    styleCell(3,col, headers[i], GREY);
  });

  if(sigRemarkIdx.length){
    const c1 = sigRemarkIdx[0]+1, c2 = sigRemarkIdx[sigRemarkIdx.length-1]+1;
    if(c2>c1) ws.mergeCells(3,c1,3,c2);
    styleCell(3,c1, formatDateDMY(state.attendanceDate), GREY);
    sigRemarkIdx.forEach(i=>{ styleCell(4,i+1, headers[i], GREEN); });
  }

  state.outputRows.forEach((r,ri)=>{
    headers.forEach((h,ci)=>{
      const cell = ws.getCell(5+ri, ci+1);
      cell.value = r[h];
      cell.alignment = {horizontal:'center', vertical:'middle'};
    });
  });

  headers.forEach((h,i)=>{ ws.getColumn(i+1).width = Math.max(14, h.length+4); });

  const thin = {style:'thin', color:{argb:'FF000000'}};
  const totalRows = 4 + state.outputRows.length;
  for(let r=1;r<=totalRows;r++){
    for(let c=1;c<=Math.max(colCount,1);c++){
      ws.getCell(r,c).border = {top:thin, left:thin, bottom:thin, right:thin};
    }
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = base + '-attendance.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function csvEsc(v){ v=String(v??''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(filename, headers, rows2d){
  const lines=[headers.map(csvEsc).join(','), ...rows2d.map(r=>r.map(csvEsc).join(','))];
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadWhatsapp(silent){
  const nameCols = state.outputHeaders.filter(h=>norm(h).includes('name'));
  const mobileCol = state.outputHeaders.find(h=>{ const n=norm(h); return n.includes('mobile')||n.includes('mob')||n.includes('phone')||n.includes('contact'); });
  if(!nameCols.length || !mobileCol){
    if(!silent) alert('Could not find name / mobile columns to build this from — rename a column to include "Name" and one to include "Mobile".');
    return;
  }
  const rows2d = state.outputRows.map(r=>[nameCols.map(c=>r[c]).filter(Boolean).join(' ').trim(), r[mobileCol]??'']);
  const base=(state.fileName||'student-data').replace(/\.[^.]+$/,'');
  downloadCSV(base+'-whatsapp-group.csv', ['name','mobile'], rows2d);
}

/* render */
function render(){
  const app=document.getElementById('app');
  let body='';
  if(state.step===1) body = renderUpload();
  else if(state.step===20) body = renderOnboarding();
  else if(state.step===2) body = renderChoice();
  else if(state.step===3) body = renderColumns();
  else if(state.step===4) body = renderDownload();

  app.innerHTML = `
    <h1>${state.fileName ? (state.context==='attendance' ? 'Attendance' : 'Student Data + Contact CSV') : 'Student Data Formatter'}</h1>
    ${state.fileName && state.step!==1 ? `<div class="file-chip"><span>${esc(state.fileName)} · ${state.rows.length} rows</span><button onclick="resetAll()">Remove</button></div>` : ''}
    ${body}
  `;

  if(state.step===1){
    const dz=document.getElementById('dropzone'), fi=document.getElementById('fileInput');
    dz.addEventListener('click', ()=>fi.click());
    fi.addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0],'student'); });
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0],'student'); });

    const dzA=document.getElementById('dropzoneAttendance'), fiA=document.getElementById('fileInputAttendance');
    dzA.addEventListener('click', ()=>fiA.click());
    fiA.addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0],'attendance'); });
    dzA.addEventListener('dragover', e=>{ e.preventDefault(); dzA.classList.add('drag'); });
    dzA.addEventListener('dragleave', ()=>dzA.classList.remove('drag'));
    dzA.addEventListener('drop', e=>{ e.preventDefault(); dzA.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0],'attendance'); });
  }
}

function renderUpload(){
  return `
    <div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap;">
      <div style="text-align:center;">
        <div class="dropzone" id="dropzone"><span class="arrow">&#8595;</span></div>
        <div class="upload-label">Upload File</div>
        <div class="hint" style="font-weight:600;color:var(--accent);font-size:13px;">Student Data</div>
      </div>
      <div style="text-align:center;">
        <div class="dropzone" id="dropzoneAttendance"><span class="arrow">&#8595;</span></div>
        <div class="upload-label">Upload File</div>
        <div class="hint" style="font-weight:600;color:var(--accent);font-size:13px;">Attendance</div>
      </div>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
    <input type="file" id="fileInputAttendance" accept=".xlsx,.xls,.csv">
  `;
}

function renderOnboarding(){
  const hasFile = state.headers.length>0;
  return `
    <span class="back" onclick="state.step=1; render();">&larr; Back</span>
    <div class="result-label">set up your column format (one time)</div>
    ${state.draft.map((c,i)=>`
      <div class="col-row${justMoved.has(c.id)?' bounce':''}" data-id="${c.id}" ondragover="dragOverRow(event,'draft',${i})">
        <div class="name">${esc(c.name)}</div>
        ${hasFile ? `
        <select class="src">
          <option value="">(no match)</option>
          ${state.headers.map(h=>`<option value="${esc(h)}" ${autoMatch(c.name,state.headers)===h?'selected':''}>${esc(h)}</option>`).join('')}
        </select>` : ''}
        <button class="icon-btn" draggable="true" ondragstart="dragStart(event,'draft',${i})" ondragend="dragEnd()">=</button>
        <button class="icon-btn x" onclick="draftDel('${c.id}')">&times;</button>
      </div>`).join('')}
    <div class="add-row">
      <input id="newColName2" placeholder="column name" onkeydown="if(event.key==='Enter'){draftAdd(this.value); this.value='';}">
      <button class="icon-btn" onclick="const i=document.getElementById('newColName2'); draftAdd(i.value); i.value='';">+</button>
    </div>
    <button class="btn btn-gold" onclick="saveOnboarding()">save &amp; continue</button>
  `;
}

function renderChoice(){
  return `
    ${state.context==='attendance' ? `
    <div class="result-label">Company Name:</div>
    <input id="companyNameInput" placeholder="Enter company name" value="${esc(state.companyName||'')}"
      oninput="state.companyName=this.value" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;font-size:13.5px;color:var(--text);font-family:var(--font);margin-bottom:18px;">
    <div class="result-label">Date:</div>
    <input type="date" id="attendanceDateInput" value="${esc(state.attendanceDate||'')}"
      oninput="state.attendanceDate=this.value" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;font-size:13.5px;color:var(--text);font-family:var(--font);margin-bottom:18px;">
    ` : ''}
    <div class="result-label">Result:</div>
    <label class="radio-row"><input type="radio" name="m" ${state.modeChoice==='permanent'?'checked':''} onchange="selectPermanent()"><span>${state.context==='attendance' ? 'Permanent Format ( Attendance )' : 'Permanent Format ( Student Data + Contact CSV )'}</span></label>
    <label class="radio-row"><input type="radio" name="m" ${state.modeChoice==='edit'?'checked':''} onchange="selectEdit()"><span>Edit Column</span></label>
    <button class="btn btn-gold" ${state.modeChoice==='edit'?'':'disabled'} onclick="proceedChoice()">Continue</button>
  `;
}

function renderColumns(){
  const locked = state.mode==='permanent';
  return `
    <span class="back" onclick="state.step=2; render();">&larr; Back</span>
    <div class="col-heading">Update Column:</div>
    ${state.currentFormat.map((c,i)=>`
      <div class="col-row${justMoved.has(c.id)?' bounce':''}" data-id="${c.id}" ${locked?'':`ondragover="dragOverRow(event,'current',${i})"`}>
        ${locked
          ? `<div class="name">${esc(c.name)}</div>`
          : `<input class="name" value="${esc(c.name)}" onchange="colRename('${c.id}', this.value)">`}
        ${c.type==='serial'
          ? `<div class="name" style="flex:1;color:var(--muted);">Auto Sr. No.</div>`
          : c.type==='blank'
          ? `<div class="name" style="flex:1;color:var(--muted);">Blank column</div>`
          : (c.type==='concat' || c.concat)
          ? `<div class="name" style="flex:1;color:var(--muted);">Combined column</div>`
          : `<select class="src" onchange="colSetSource('${c.id}', this.value)">
          <option value="">(no match)</option>
          ${state.headers.map(h=>`<option value="${esc(h)}" ${c.source===h?'selected':''}>${esc(h)}</option>`).join('')}
        </select>`}
        ${locked ? '' : `
        <button class="icon-btn" draggable="true" ondragstart="dragStart(event,'current',${i})" ondragend="dragEnd()">=</button>
        <button class="icon-btn x" onclick="colDel('${c.id}')">&times;</button>`}
      </div>`).join('')}
    ${locked ? '' : `
    <div class="add-row">
      <input id="newColName" placeholder="Add Column Name" onkeydown="if(event.key==='Enter') addCol();">
      <button class="icon-btn" onclick="addCol()">+</button>
    </div>
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px;" onclick="addNameConcat()">+ Add "Name" (First + Middle + Last combined)</button>`}
    <button class="btn btn-gold" onclick="submitCols()">Submit</button>
  `;
}

function deptCounts(){
  const col = state.outputHeaders.find(h=>{ const n=norm(h); return n.includes('degree')||n.includes('department')||n.includes('branch')||n.includes('course'); });
  if(!col) return null;
  const counts = {};
  state.outputRows.forEach(r=>{
    const v = (r[col]||'').toString().trim() || '(blank)';
    counts[v] = (counts[v]||0)+1;
  });
  return {col, counts};
}

function jobProfileCounts(){
  const col = state.outputHeaders.find(h=>{ const n=norm(h); return n.includes('jobprofile')||n.includes('jobtitle')||n.includes('jobrole')||(n.includes('job')&&n.includes('profile'))||n.includes('position'); });
  if(!col) return null;
  const counts = {};
  state.outputRows.forEach(r=>{
    const v = (r[col]||'').toString().trim() || '(blank)';
    counts[v] = (counts[v]||0)+1;
  });
  return {col, counts};
}

function renderDownload(){
  const dc = deptCounts();
  const jc = jobProfileCounts();
  return `
    <span class="back" onclick="state.step = 2; render();">&larr; Back</span>
    <div class="result-label" style="text-align:center;">${state.outputRows.length} students formatted</div>
    <button class="btn" onclick="resetAll()">Start Over</button>
    ${dc ? `
    <div class="col-heading">Department Wise Count:</div>
    ${Object.entries(dc.counts).map(([k,v])=>`
      <div class="count-row"><div class="count-label">${esc(k)}</div><div class="count-value">${v}</div></div>
    `).join('')}
    ` : ''}
    ${jc ? `
    <div class="col-heading">Job Profile Wise Count:</div>
    ${Object.entries(jc.counts).map(([k,v])=>`
      <div class="count-row"><div class="count-label">${esc(k)}</div><div class="count-value">${v}</div></div>
    `).join('')}
    ` : ''}
  `;
}

async function init(){
  render();
}
init();
</script>
</body>
</html>
