<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Data Formatter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f7f7f8; --surface:#ffffff; --border:#e0e0e3; --text:#20232a;
    --muted:#6b7280; --faint:#9aa1ac; --accent:#7c4fd6; --red:#c4554d;
    --radius:6px; --font:'Segoe UI',Arial,sans-serif; --mono:'Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);}
  #app{max-width:520px;margin:0 auto;padding:40px 20px 80px;}
  h1{font-size:16px;font-weight:600;text-align:center;color:var(--muted);margin:0 0 34px;letter-spacing:.02em;}
  .back{font-size:12.5px;color:var(--faint);cursor:pointer;margin-bottom:16px;display:inline-block;}
  .back:hover{color:var(--muted);}

  /* upload */
  .dropzone{border:2px dashed var(--border);border-radius:16px;width:120px;height:100px;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .dropzone:hover, .dropzone.drag{border-color:var(--accent);}
  .dropzone .arrow{font-size:26px;color:var(--muted);}
  .upload-label{text-align:center;color:var(--muted);font-size:14px;margin-bottom:26px;}
  input[type=file]{display:none;}
  .file-chip{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:20px;font-size:12.5px;}
  .file-chip button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;}
  .file-chip button:hover{color:var(--red);}

  /* result radios */
  .result-label{font-size:14px;color:var(--muted);margin-bottom:12px;}
  .radio-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);
    border-radius:var(--radius);margin-bottom:10px;cursor:pointer;background:var(--surface);}
  .radio-row:hover{border-color:var(--accent);}
  .radio-row input{accent-color:var(--accent);width:15px;height:15px;}
  .radio-row span{font-size:14px;}

  /* column list */
  .col-heading{font-size:14px;color:var(--muted);margin:26px 0 12px;}
  .col-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .col-row .name{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 12px;font-size:13.5px;font-family:var(--mono);}
  .col-row input.name{width:100%;color:var(--text);}
  .col-row select.src{width:150px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 8px;font-size:12px;color:var(--muted);font-family:var(--mono);}
  .col-row .src-empty{width:150px;flex-shrink:0;}
  .icon-btn{width:30px;height:30px;flex-shrink:0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);color:var(--muted);cursor:pointer;font-size:14px;font-family:var(--mono);}
  .icon-btn:hover{color:var(--text);border-color:var(--faint);}
  .icon-btn.x:hover{color:var(--red);border-color:var(--red);}
  .icon-btn:disabled{opacity:.25;cursor:default;}

  .add-row{display:flex;gap:8px;margin:14px 0 0;}
  .add-row input{flex:1;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
    padding:9px 12px;font-size:13px;color:var(--text);font-family:var(--mono);}

  /* buttons */
  .btn{width:100%;padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-size:14px;font-weight:600;cursor:pointer;margin-top:22px;}
  .btn:hover{border-color:var(--faint);}
  .btn-gold{background:var(--accent);border-color:var(--accent);color:#ffffff;}
  .btn-gold:hover{background:#6a3fc0;}
  .btn[disabled]{opacity:.35;filter:blur(.3px);cursor:not-allowed;}
  .btn[disabled]:hover{border-color:var(--border);}
  .link-btn{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--faint);
    text-decoration:underline;cursor:pointer;background:none;border:none;width:100%;}
  .link-btn:hover{color:var(--muted);}

  .hint{font-size:11.5px;color:var(--faint);text-align:center;margin-top:10px;}

  @media (max-width:480px){
    .col-row{flex-wrap:wrap;}
    .col-row .name{flex:1 1 100%;order:1;}
    .col-row select.src, .col-row .src-empty{order:2;flex:1 1 auto;width:auto;}
    .col-row .icon-btn{order:3;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const state = {
  step: 1, fileName:null, headers:[], rows:[],
  permanentFormat: null, mode:null, modeChoice:null,
  currentFormat: [], outputHeaders:[], outputRows:[], submitted:false,
  onboarding:false, draft:[],
};

const DEFAULT_FORMAT = [
  'EnrollmentNo','FirstName','MiddleName','LastName','StudentMobNo','EmailId',
  'CurrentDegree','SSCPercentage','HSCPercentage','DiplomaPercentage',
  'Graduation Percentage','Current CGPA','Resume Link','Job Profile'
];

async function loadFmt(){
  if(window.storage){
    try{
      const r = await window.storage.get('lj_format_v1');
      if(r && r.value) return JSON.parse(r.value);
    }catch(e){ /* no saved format yet */ }
    return null;
  }
  try{ const r=localStorage.getItem('lj_format_v1'); return r?JSON.parse(r):null; }catch(e){ return null; }
}
async function saveFmt(cols){
  if(window.storage){
    try{ await window.storage.set('lj_format_v1', JSON.stringify(cols)); }
    catch(e){ console.warn('save failed', e); }
    return;
  }
  try{ localStorage.setItem('lj_format_v1', JSON.stringify(cols)); }catch(e){}
}

const FIELD_ALIASES = {
  studentmobno: ['mobile','mob','contact','phone','whatsapp'],
  enrollmentno: ['enrollment','enroll'],
  firstname: ['firstname','fname'],
  middlename: ['middlename','mname'],
  lastname: ['lastname','surname'],
  emailid: ['email'],
  currentdegree: ['degree','department','branch','course'],
  sscpercentage: ['ssc','10th'],
  hscpercentage: ['hsc','12th'],
  diplomapercentage: ['diploma'],
  graduationpercentage: ['graduation','bachelor'],
  currentcgpa: ['cgpa','cpi'],
  resumelink: ['resume','cv'],
  jobprofile: ['jobprofile','jobtitle','role','profile'],
};

function uid(){ return 'c'+Math.random().toString(36).slice(2,9); }
function norm(s){ return String(s||'').trim().toLowerCase().replace(/[\s_-]+/g,''); }
function autoMatch(name, headers){
  const n = norm(name);
  let m = headers.find(h=>norm(h)===n);
  if(m) return m;
  m = headers.find(h=>norm(h).includes(n)||n.includes(norm(h)));
  if(m) return m;
  const aliases = FIELD_ALIASES[n];
  if(aliases){
    m = headers.find(h=>{ const hn=norm(h); return aliases.some(a=>hn.includes(a)); });
    if(m) return m;
  }
  return null;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function resetAll(){
  state.step=1; state.fileName=null; state.headers=[]; state.rows=[];
  state.mode=null; state.modeChoice=null; state.currentFormat=[]; state.outputHeaders=[];
  state.outputRows=[]; state.submitted=false; state.onboarding=false; render();
}

function handleFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:false});
      if(!aoa.length){ alert('File is empty.'); return; }
      const headers = aoa[0].map(h=>String(h).trim()).filter(Boolean);
      const rows = aoa.slice(1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{
        const o={}; headers.forEach((h,i)=>o[h]=r[i]!==undefined?String(r[i]):''); return o;
      });
      if(!headers.length || !rows.length){ alert('Could not find header + data rows.'); return; }
      state.fileName=file.name; state.headers=headers; state.rows=rows;
      state.step = state.permanentFormat ? 2 : 20; // 20 = onboarding
      render();
    }catch(err){ console.error(err); alert('Could not read this file.'); }
  };
  reader.readAsArrayBuffer(file);
}

/* onboarding: define permanent columns once */
function draftAdd(name){
  name=(name||'').trim(); if(!name) return;
  if(state.draft.some(c=>norm(c.name)===norm(name))) return;
  state.draft.push({id:uid(), name}); render();
}
function draftMove(id,dir){
  const i=state.draft.findIndex(c=>c.id===id), j=i+dir;
  if(j<0||j>=state.draft.length) return;
  [state.draft[i],state.draft[j]]=[state.draft[j],state.draft[i]]; render();
}
function draftDel(id){ state.draft=state.draft.filter(c=>c.id!==id); render(); }
async function saveOnboarding(){
  if(!state.draft.length){ alert('Add at least one column.'); return; }
  state.permanentFormat = state.draft.map(c=>({id:c.id,name:c.name}));
  await saveFmt(state.permanentFormat);
  state.step = 2; render();
}

/* choose permanent / edit */
function selectPermanent(){
  state.modeChoice = 'permanent';
  state.mode = 'permanent';
  state.currentFormat = state.permanentFormat.map(c=>({
    id:c.id, name:c.name, source: autoMatch(c.name, state.headers)
  }));
  buildOutput();
  state.submitted = true;
  downloadFile();
  setTimeout(()=>downloadWhatsapp(true), 500);
  state.step = 4;
  render();
}
function selectEdit(){
  state.modeChoice = 'edit';
  render();
}
function proceedChoice(){
  if(state.modeChoice!=='edit') return;
  state.mode = 'edit';
  state.currentFormat = state.permanentFormat.map(c=>({
    id:c.id, name:c.name, source: autoMatch(c.name, state.headers)
  }));
  state.submitted = false;
  state.step = 3;
  render();
}

/* column update screen */
function colMove(id,dir){
  const i=state.currentFormat.findIndex(c=>c.id===id), j=i+dir;
  if(j<0||j>=state.currentFormat.length) return;
  [state.currentFormat[i],state.currentFormat[j]]=[state.currentFormat[j],state.currentFormat[i]]; render();
}
function colDel(id){ state.currentFormat = state.currentFormat.filter(c=>c.id!==id); render(); }
function colRename(id,val){ const c=state.currentFormat.find(c=>c.id===id); if(c) c.name=val; }
function colSetSource(id,val){ const c=state.currentFormat.find(c=>c.id===id); if(c) c.source=val||null; render(); }
function addCol(){
  const input = document.getElementById('newColName');
  const name = (input.value||'').trim();
  if(!name) return;
  state.currentFormat.push({id:uid(), name, source: autoMatch(name, state.headers)});
  input.value=''; render();
}

function buildOutput(){
  state.outputHeaders = state.currentFormat.map(c=>c.name);
  state.outputRows = state.rows.map(r=>{
    const o={}; state.currentFormat.forEach(c=>{ o[c.name] = c.source ? (r[c.source]??'') : ''; }); return o;
  });
}
function submitCols(){
  if(!state.currentFormat.length){ alert('No columns.'); return; }
  buildOutput(); state.submitted=true;
  downloadFile();
  setTimeout(()=>downloadWhatsapp(true), 500);
  state.step=4; render();
}

/* downloads */
function downloadFile(){
  if(!state.outputRows.length) return;
  const base = (state.fileName||'student-data').replace(/\.[^.]+$/,'');
  const ws = XLSX.utils.json_to_sheet(state.outputRows, {header: state.outputHeaders});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Student Data');
  XLSX.writeFile(wb, base + '-formatted.xlsx');
}
function csvEsc(v){ v=String(v??''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(filename, headers, rows2d){
  const lines=[headers.map(csvEsc).join(','), ...rows2d.map(r=>r.map(csvEsc).join(','))];
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadWhatsapp(silent){
  const nameCols = state.outputHeaders.filter(h=>norm(h).includes('name'));
  const mobileCol = state.outputHeaders.find(h=>{ const n=norm(h); return n.includes('mobile')||n.includes('mob')||n.includes('phone')||n.includes('contact'); });
  if(!nameCols.length || !mobileCol){
    if(!silent) alert('Could not find name / mobile columns to build this from — rename a column to include "Name" and one to include "Mobile".');
    return;
  }
  const rows2d = state.outputRows.map(r=>[nameCols.map(c=>r[c]).filter(Boolean).join(' ').trim(), r[mobileCol]??'']);
  const base=(state.fileName||'student-data').replace(/\.[^.]+$/,'');
  downloadCSV(base+'-whatsapp-group.csv', ['name','mobile'], rows2d);
}

/* render */
function render(){
  const app=document.getElementById('app');
  let body='';
  if(state.step===1) body = renderUpload();
  else if(state.step===20) body = renderOnboarding();
  else if(state.step===2) body = renderChoice();
  else if(state.step===3) body = renderColumns();
  else if(state.step===4) body = renderDownload();

  app.innerHTML = `
    <h1>Student Data Formatter</h1>
    ${state.fileName && state.step!==1 ? `<div class="file-chip"><span>${esc(state.fileName)} · ${state.rows.length} rows</span><button onclick="resetAll()">Remove</button></div>` : ''}
    ${body}
  `;

  if(state.step===1){
    const dz=document.getElementById('dropzone'), fi=document.getElementById('fileInput');
    dz.addEventListener('click', ()=>fi.click());
    fi.addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  }
}

function renderUpload(){
  return `
    <div class="dropzone" id="dropzone"><span class="arrow">&#8595;</span></div>
    <div class="upload-label">Upload File</div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
  `;
}

function renderOnboarding(){
  const hasFile = state.headers.length>0;
  return `
    <span class="back" onclick="state.step=1; render();">&larr; Back</span>
    <div class="result-label">set up your column format (one time)</div>
    ${state.draft.map((c,i)=>`
      <div class="col-row">
        <div class="name">${esc(c.name)}</div>
        ${hasFile ? `
        <select class="src">
          <option value="">(no match)</option>
          ${state.headers.map(h=>`<option value="${esc(h)}" ${autoMatch(c.name,state.headers)===h?'selected':''}>${esc(h)}</option>`).join('')}
        </select>` : ''}
        <button class="icon-btn" ${i===0?'disabled':''} onclick="draftMove('${c.id}',-1)">&uarr;</button>
        <button class="icon-btn" ${i===state.draft.length-1?'disabled':''} onclick="draftMove('${c.id}',1)">&darr;</button>
        <button class="icon-btn x" onclick="draftDel('${c.id}')">&times;</button>
      </div>`).join('')}
    <div class="add-row">
      <input id="newColName2" placeholder="column name" onkeydown="if(event.key==='Enter'){draftAdd(this.value); this.value='';}">
      <button class="icon-btn" onclick="const i=document.getElementById('newColName2'); draftAdd(i.value); i.value='';">+</button>
    </div>
    <button class="btn btn-gold" onclick="saveOnboarding()">save &amp; continue</button>
  `;
}

function renderChoice(){
  return `
    <div class="result-label">Result:</div>
    <label class="radio-row"><input type="radio" name="m" ${state.modeChoice==='permanent'?'checked':''} onchange="selectPermanent()"><span>Permanent Format ( Student Data + Contact CSV )</span></label>
    <label class="radio-row"><input type="radio" name="m" ${state.modeChoice==='edit'?'checked':''} onchange="selectEdit()"><span>Edit Column</span></label>
    <button class="btn btn-gold" ${state.modeChoice==='edit'?'':'disabled'} onclick="proceedChoice()">Continue</button>
  `;
}

function renderColumns(){
  const locked = state.mode==='permanent';
  return `
    <span class="back" onclick="state.step=2; render();">&larr; Back</span>
    <div class="col-heading">update column:</div>
    ${state.currentFormat.map((c,i)=>`
      <div class="col-row">
        ${locked
          ? `<div class="name">${esc(c.name)}</div>`
          : `<input class="name" value="${esc(c.name)}" onchange="colRename('${c.id}', this.value)">`}
        <select class="src" onchange="colSetSource('${c.id}', this.value)">
          <option value="">(no match)</option>
          ${state.headers.map(h=>`<option value="${esc(h)}" ${c.source===h?'selected':''}>${esc(h)}</option>`).join('')}
        </select>
        ${locked ? '' : `
        <button class="icon-btn" ${i===0?'disabled':''} onclick="colMove('${c.id}',-1)">&uarr;</button>
        <button class="icon-btn" ${i===state.currentFormat.length-1?'disabled':''} onclick="colMove('${c.id}',1)">&darr;</button>
        <button class="icon-btn x" onclick="colDel('${c.id}')">&times;</button>`}
      </div>`).join('')}
    ${locked ? '' : `
    <div class="add-row">
      <input id="newColName" placeholder="add column name" onkeydown="if(event.key==='Enter') addCol();">
      <button class="icon-btn" onclick="addCol()">+</button>
    </div>`}
    <button class="btn btn-gold" onclick="submitCols()">submit</button>
  `;
}

function deptCounts(){
  const col = state.outputHeaders.find(h=>{ const n=norm(h); return n.includes('degree')||n.includes('department')||n.includes('branch')||n.includes('course'); });
  if(!col) return null;
  const counts = {};
  state.outputRows.forEach(r=>{
    const v = (r[col]||'').toString().trim() || '(blank)';
    counts[v] = (counts[v]||0)+1;
  });
  return {col, counts};
}

function jobProfileCounts(){
  const col = state.outputHeaders.find(h=>{ const n=norm(h); return n.includes('jobprofile')||n.includes('jobtitle')||n.includes('jobrole')||(n.includes('job')&&n.includes('profile'))||n.includes('position'); });
  if(!col) return null;
  const counts = {};
  state.outputRows.forEach(r=>{
    const v = (r[col]||'').toString().trim() || '(blank)';
    counts[v] = (counts[v]||0)+1;
  });
  return {col, counts};
}

function renderDownload(){
  const dc = deptCounts();
  const jc = jobProfileCounts();
  return `
    <span class="back" onclick="state.step = (state.mode==='permanent' ? 2 : 3); render();">&larr; Back</span>
    <div class="result-label" style="text-align:center;">${state.outputRows.length} students formatted</div>
    <button class="btn" onclick="resetAll()">Start Over</button>
    ${dc ? `
    <div class="col-heading">Department Wise Count:</div>
    ${Object.entries(dc.counts).map(([k,v])=>`
      <div class="col-row"><div class="name">${esc(k)}</div><div class="name" style="flex:0 0 60px;text-align:center;">${v}</div></div>
    `).join('')}
    ` : ''}
    ${jc ? `
    <div class="col-heading">Job Profile Wise Count:</div>
    ${Object.entries(jc.counts).map(([k,v])=>`
      <div class="col-row"><div class="name">${esc(k)}</div><div class="name" style="flex:0 0 60px;text-align:center;">${v}</div></div>
    `).join('')}
    ` : ''}
  `;
}

async function init(){
  const loaded = await loadFmt();
  if(loaded && loaded.length){
    state.permanentFormat = loaded;
  }else{
    state.permanentFormat = DEFAULT_FORMAT.map(name => ({id:uid(), name}));
    await saveFmt(state.permanentFormat);
  }
  render();
}
init();
</script>
</body>
</html>
